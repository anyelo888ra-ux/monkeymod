<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MonkeyMod - Autorizando...</title>
    <style>
        body { background-color: #1e1e24; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: #2a2a32; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 360px; border-top: 4px solid #4cc9f0; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #4cc9f0; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="spinner"></div>
    <h3>Autorizando Aplicación</h3>
    <p>Generando credenciales de forma segura...</p>
    <p style="font-size: 12px; font-style: italic;">Por favor, no cierres esta ventana.</p>
</div>

<script>
    // Pequeño script para redireccionar automáticamente si no se hace desde oauth.html
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const redirect = urlParams.get('redirect');

        if (token && redirect) {
            setTimeout(() => {
                window.location.href = `${redirect}?token=${token}`;
            }, 1500); // 1.5 segundos de retraso para que se vea la animación pro
        }
    };
</script>

</body>
</html>
