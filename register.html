<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyMod - Registrarse</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d1117;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .auth-card h2 {
            margin-top: 0;
            color: #00bcd4;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: white;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background-color: #00bcd4;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover { background-color: #00acc1; }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; text-align: center; }
        .link-footer { text-align: center; margin-top: 15px; font-size: 13px; }
        .link-footer a { color: #58a6ff; text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>🐵 Crear Cuenta</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Nombre de usuario</label>
                <input type="text" id="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">Registrarse</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
        <div class="link-footer">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://monkeymod-l9hq.onrender.com';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btnSubmit = document.getElementById('btnSubmit');

            errorMsg.textContent = '';
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Cargando...';

            try {
                const res = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = data.error || 'Error al registrarse';
                }
            } catch (err) {
                errorMsg.textContent = 'No se pudo conectar con el servidor Backend.';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Registrarse';
            }
        });
    </script>
</body>
</html>
