<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyMod - Registrarse</title>
    <style>
        body { background-color: #1e1e24; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-card { background: #2a2a32; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 350px; border-top: 4px solid #ff9f1c; }
        .logo { font-size: 26px; font-weight: bold; color: #ff9f1c; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #aaa; font-size: 14px; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #ddd; }
        input { padding: 12px; border-radius: 6px; border: 1px solid #444; background: #1e1e24; color: white; font-size: 14px; }
        input:focus { border-color: #ff9f1c; outline: none; }
        .btn-register { background: #ff9f1c; color: #1e1e24; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; width: 100%; transition: background 0.2s; }
        .btn-register:hover { background: #e08b14; }
        .footer-text { text-align: center; margin-top: 20px; font-size: 13px; color: #aaa; }
        .footer-text a { color: #4cc9f0; text-decoration: none; font-weight: bold; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
    <!-- ⚠️ IMPORTANTE: Aquí debes importar la CDN oficial de Supabase.js para que tus scripts sirvan -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="register-card">
    <div class="logo">🐒 MonkeyMod</div>
    <div class="subtitle">Crea tu cuenta global de desarrollador</div>
    
    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label for="username">Nombre de Usuario:</label>
            <input type="text" id="username" placeholder="Ej. c00lkidd_v2yt" required>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" placeholder="tu@correo.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="••••••••" minlength="6" required>
        </div>
        
        <button type="submit" class="btn-register">Crear Cuenta</button>
    </form>

    <div class="footer-text">
        ¿Ya tienes una cuenta? <a href="/login.html">Inicia sesión aquí</a>
    </div>
</div>

<script>
    // 🛠️ CONFIGURACIÓN DE TU CLIENTE SUPABASE
    // Reemplaza estos dos textos con la URL y la Anon Key reales de tu panel de Supabase Settings
    const SUPABASE_URL = "https://dppaqhiucepnrhfcvazv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_OgDOFs-FOi1mq7U-5qnVtg_7Ho9JfY2";
    
    // Inicializa el cliente nativo
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleRegister(event) {
        event.preventDefault(); // Evita que la página se recargue sola

        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // 🚀 Envío de datos al motor de encriptación seguro de Supabase
        const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: {
                // Adjuntamos el username en los metadatos para que el Trigger lo copie a tu tabla 'accounts'
                data: {
                    user_name: username,
                    avatar_url: 'https://mit.edu'
                }
            }
        });

        if (error) {
            console.error("Fallo en el registro:", error.message);
            alert("Error al registrar la cuenta: " + error.message);
        } else {
            console.log("¡Usuario registrado y contraseña encriptada!", data.user);
            alert("¡Cuenta de MonkeyMod creada con éxito! Ahora puedes iniciar sesión.");
            window.location.href = "/login.html"; // Redirección automática
        }
    }
</script>

</body>
</html>
