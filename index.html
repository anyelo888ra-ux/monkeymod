<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐵 MonkeyMod - Programación con capacidades infinitas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #111111;
            color: white;
            margin: 0;
            padding: 0;
        }
        /* Navbar estilo PenguinMod */
        nav {
            background-color: #00bcd4;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }
        .search-box {
            display: flex;
            gap: 5px;
        }
        .search-box input {
            padding: 8px;
            border-radius: 4px;
            border: none;
        }
        .search-box button {
            background-color: #ffab19;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        /* Contenido Principal */
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, #00bcd4 0%, #111111 100%);
        }
        .hero h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 20px;
            color: #e0e0e0;
        }
        .btn-try {
            background-color: #ffab19;
            color: #111111;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 171, 25, 0.4);
        }
        .btn-try:hover {
            background-color: #e59500;
        }
        /* Sección de Video */
        .video-section {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .video-container {
            width: 100%;
            max-width: 560px;
            aspect-ratio: 16/9;
            border: 4px solid #ffab19;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">🐵 MonkeyMod</a>
        <form class="search-box" action="search.html" method="GET">
            <input type="text" name="q" placeholder="Buscar proyectos..." required>
            <button type="submit">Buscar</button>
        </form>
    </nav>

    <div class="hero">
        <h1>Programación basada en bloques con capacidades infinitas</h1>
        <p>Creado usando Scratch y optimizado para la web.</p>
        <a href="edit.html" class="btn-try">¡Pruébalo!</a>
    </div>

    <div class="video-section">
        <div class="video-container">
            <!-- Ponemos un video de ejemplo, luego puedes cambiar el ID dQw4w9WgXcQ por el tuyo -->
            <iframe width="100%" height="100%" src="https://youtube.com" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
