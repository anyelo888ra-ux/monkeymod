<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐵 MonkeyMod v2.0 - Motor Nativo Independiente</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --panel-bg: #181b24;
            --border-color: #232834;
            --accent-orange: #ffab19;
            --motion-blue: #4c97ff;
            --control-orange: #ffab19;
            --custom-purple: #9966ff;
            --danger-red: #dc3545;
            --success-green: #28a745;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* Encabezado Principal */
        header { 
            background-color: var(--panel-bg); 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--accent-orange); 
        }

        .title { 
            font-size: 20px; 
            font-weight: bold; 
            color: var(--accent-orange); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .badge {
            font-size: 11px;
            background: var(--accent-orange);
            color: #111;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .project-id-display {
            font-size: 12px;
            color: #888;
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Botones de acción */
        button, select { 
            background-color: var(--accent-orange); 
            border: none; 
            color: #111; 
            padding: 8px 12px; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover, select:hover { 
            filter: brightness(1.15);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        select {
            background-color: #232834;
            color: white;
            border: 1px solid var(--border-color);
            outline: none;
        }

        .btn-file { background-color: #6c757d; color: white; }
        .btn-inject { background-color: #00bcd4; color: white; }
        .btn-run { background-color: var(--success-green); color: white; }
        .btn-play { background-color: #4c97ff; color: white; }
        .btn-clear { background-color: var(--danger-red); color: white; }

        /* Contenedor del Editor */
        .editor-container { display: flex; flex: 1; height: calc(100vh - 55px); }

        /* 1. Barra de Categorías + Herramientas (Izquierda) */
        .sidebar {
            width: 280px;
            background-color: #11141a;
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .category-tabs {
            display: flex;
            background: #0b0d10;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            padding: 10px 5px;
            font-size: 11px;
            text-align: center;
            cursor: pointer;
            color: #888;
            font-weight: bold;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: white;
            border-bottom-color: var(--accent-orange);
            background: var(--panel-bg);
        }

        .toolbox { 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            overflow-y: auto; 
            flex: 1;
        }

        .toolbox-title { 
            font-size: 12px; 
            font-weight: bold; 
            color: #888; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 4px; 
        }

        /* Diseños de los Bloques */
        .monkey-block { 
            color: white; 
            padding: 10px 14px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 13px; 
            cursor: grab; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            border-left: 5px solid rgba(0,0,0,0.3); 
            position: relative;
        }

        .monkey-block:active { cursor: grabbing; }

        .block-input { 
            background: rgba(255, 255, 255, 0.25); 
            border: none; 
            color: white; 
            padding: 3px 6px; 
            border-radius: 4px; 
            width: 45px; 
            text-align: center; 
            font-weight: bold; 
            outline: none;
        }

        /* Colores de categorías */
        .block-motion { background-color: var(--motion-blue); }
        .block-control { background-color: var(--control-orange); color: #111; }
        .block-control .block-input { background: rgba(0, 0, 0, 0.15); color: #111; }
        .block-custom { background-color: var(--custom-purple); }

        /* Botón de borrar bloque en el Workspace */
        .btn-delete-block {
            display: none;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
        }

        .workspace .btn-delete-block { display: flex; }

        /* 2. Workspace (Centro) */
        .workspace { 
            flex: 1; 
            background-color: #161920; 
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px); 
            background-size: 20px 20px; 
            padding: 20px; 
            position: relative; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            align-items: flex-start; 
        }

        .workspace:empty::before { 
            content: attr(data-placeholder); 
            color: #4f5a70; 
            font-size: 15px; 
            position: absolute; 
            top: 45%; 
            left: 20%; 
            pointer-events: none; 
        }

        /* 3. Escenario (Derecha) */
        .stage-area { 
            width: 340px; 
            background-color: var(--panel-bg); 
            border-left: 2px solid var(--border-color); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
        }

        .canvas-simulation { 
            width: 300px; 
            height: 240px; 
            background-color: #ffffff; 
            border-radius: 8px; 
            border: 3px solid var(--border-color); 
            position: relative; 
            overflow: hidden; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        #monkey-sprite { 
            font-size: 40px; 
            position: absolute; 
            top: 100px; 
            left: 130px; 
            transition: all 0.2s ease-out; 
            line-height: 1;
            transform-origin: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">
            🐵 MonkeyMod <span class="badge">v2.0</span>
            <span id="display-id" class="project-id-display">ID: -------</span>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <select id="lang-select">
                <option value="es">🇪🇸 Español</option>
                <option value="en">🇺🇸 English</option>
            </select>
            <button class="btn-file" id="btn-save">💾 <span data-i18n="save">Guardar (.monkey)</span></button>
            <button class="btn-file" id="btn-load">📂 <span data-i18n="load">Cargar (.monkey)</span></button>
            <input type="file" id="file-input" accept=".monkey" style="display: none;">
            
            <button class="btn-inject" id="btn-inject">➕ <span data-i18n="inject">Inyectar (JS)</span></button>
            <button class="btn-run" id="btn-run">🟢 <span data-i18n="run">Ejecutar</span></button>
            <button class="btn-play" id="btn-play">▶️ <span data-i18n="play">Modo Jugador</span></button>
            <button class="btn-clear" id="btn-clear">🔴 <span data-i18n="clear">Limpiar</span></button>
        </div>
    </header>

    <div class="editor-container">
        <!-- 1. BARRA DE HERRAMIENTAS -->
        <div class="sidebar">
            <div class="category-tabs">
                <div class="tab active" onclick="filterCategory('all', this)" data-i18n="tab_all">Todos</div>
                <div class="tab" onclick="filterCategory('motion', this)" data-i18n="tab_motion">Movimiento</div>
                <div class="tab" onclick="filterCategory('control', this)" data-i18n="tab_control">Control</div>
                <div class="tab" onclick="filterCategory('custom', this)" data-i18n="tab_custom">Inyectados</div>
            </div>

            <div class="toolbox" id="monkey-toolbox">
                <!-- Bloques de Movimiento -->
                <div class="block-group" data-cat="motion">
                    <div class="toolbox-title" data-i18n="cat_motion">Movimiento</div>
                    <div class="monkey-block block-motion" draggable="true" data-action="move">
                        <span><span data-i18n="blk_move">Mover</span> <input type="number" class="block-input" value="10" onclick="event.stopPropagation()"> <span data-i18n="blk_steps">pasos</span></span>
                        <span class="btn-delete-block" onclick="removeBlock(this)">✕</span>
                    </div>
                    <div class="monkey-block block-motion" draggable="true" data-action="rotate">
                        <span><span data-i18n="blk_rotate">Girar</span> 🔄 <input type="number" class="block-input" value="15" onclick="event.stopPropagation()"> <span data-i18n="blk_degrees">grados</span></span>
                        <span class="btn-delete-block" onclick="removeBlock(this)">✕</span>
                    </div>
                    <div class="monkey-block block-motion" draggable="true" data-action="jump">
                        <span data-i18n="blk_jump">Ir a posición aleatoria</span>
                        <span class="btn-delete-block" onclick="removeBlock(this)">✕</span>
                    </div>
                </div>

                <!-- Bloques de Control -->
                <div class="block-group" data-cat="control">
                    <div class="toolbox-title" data-i18n="cat_control">Control</div>
                    <div class="monkey-block block-control" draggable="true" data-action="reset">
                        <span data-i18n="blk_reset">Reiniciar posición</span>
                        <span class="btn-delete-block" onclick="removeBlock(this)">✕</span>
                    </div>
                </div>

                <!-- Bloques Inyectados -->
                <div class="block-group" data-cat="custom">
                    <div class="toolbox-title" data-i18n="cat_custom">Bloques Inyectados</div>
                    <div id="custom-blocks-area" style="display:flex; flex-direction:column; gap:10px;"></div>
                </div>
            </div>
        </div>

        <!-- 2. ESPACIO DE TRABAJO -->
        <div class="workspace" id="monkey-workspace" data-placeholder="Arrastra los bloques aquí para construir tu script..."></div>

        <!-- 3. ESCENARIO -->
        <div class="stage-area">
            <div class="toolbox-title" style="width: 100%;" data-i18n="stage_title">Escenario</div>
            <div class="canvas-simulation">
                <div id="monkey-sprite">🐵</div>
            </div>
            <div style="color: #626e82; font-size: 12px; text-align: center;" data-i18n="stage_help">
                Arrastra los bloques verticalmente al espacio de trabajo central y presiona "Ejecutar".
            </div>
        </div>
    </div>

    <script>
        const i18n = {
            es: {
                save: "Guardar (.monkey)",
                load: "Cargar (.monkey)",
                inject: "Inyectar (JS)",
                run: "Ejecutar",
                play: "Modo Jugador",
                clear: "Limpiar",
                tab_all: "Todos",
                tab_motion: "Movimiento",
                tab_control: "Control",
                tab_custom: "Inyectados",
                cat_motion: "Movimiento",
                cat_control: "Control",
                cat_custom: "Bloques Inyectados",
                blk_move: "Mover",
                blk_steps: "pasos",
                blk_rotate: "Girar",
                blk_degrees: "grados",
                blk_jump: "Ir a posición aleatoria",
                blk_reset: "Reiniciar posición",
                stage_title: "Escenario",
                stage_help: "Arrastra los bloques verticalmente al espacio de trabajo central y presiona 'Ejecutar'.",
                placeholder: "Arrastra los bloques aquí para construir tu script...",
                prompt_name: "Nombre de tu nuevo bloque:",
                prompt_code: "Escribe el código JavaScript a ejecutar:\nVariables: posX, posY, rotation, monkey"
            },
            en: {
                save: "Save (.monkey)",
                load: "Load (.monkey)",
                inject: "Inject (JS)",
                run: "Run",
                play: "Player Mode",
                clear: "Clear",
                tab_all: "All",
                tab_motion: "Motion",
                tab_control: "Control",
                tab_custom: "Injected",
                cat_motion: "Motion",
                cat_control: "Control",
                cat_custom: "Injected Blocks",
                blk_move: "Move",
                blk_steps: "steps",
                blk_rotate: "Turn",
                blk_degrees: "degrees",
                blk_jump: "Go to random position",
                blk_reset: "Reset position",
                stage_title: "Stage",
                stage_help: "Drag blocks vertically into the central workspace and click 'Run'.",
                placeholder: "Drag blocks here to build your script...",
                prompt_name: "New block name:",
                prompt_code: "Write the JavaScript code to execute:\nVariables: posX, posY, rotation, monkey"
            }
        };

        let currentLang = 'es';

        function updateLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) {
                    el.innerText = i18n[lang][key];
                }
            });
            const ws = document.getElementById('monkey-workspace');
            ws.setAttribute('data-placeholder', i18n[lang].placeholder);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // --- ID DE PROYECTO (NUMÉRICO 8 DÍGITOS) ---
            const urlParams = new URLSearchParams(window.location.search);
            let projectId = urlParams.get('id');

            if (!projectId) {
                projectId = Math.floor(10000000 + Math.random() * 90000000).toString();
                window.history.replaceState({}, '', `edit.html?id=${projectId}`);
            }

            document.getElementById('display-id').innerText = `ID: ${projectId}`;

            // --- SISTEMA DE IDIOMA ---
            document.getElementById('lang-select').addEventListener('change', (e) => {
                updateLanguage(e.target.value);
            });

            // --- REDIRECCIÓN AL MODO JUGADOR ---
            document.getElementById('btn-play').addEventListener('click', () => {
                saveProjectData();
                window.location.href = `play.html?id=${projectId}`;
            });

            // --- DRAG AND DROP ---
            const monkey = document.getElementById('monkey-sprite');
            const workspace = document.getElementById('monkey-workspace');
            const customBlocksArea = document.getElementById('custom-blocks-area');
            
            let posX = 130;
            let posY = 100;
            let rotation = 0;
            let draggedElement = null;

            document.addEventListener('dragstart', (e) => {
                const block = e.target.closest('.monkey-block');
                if (block) {
                    draggedElement = block;
                    e.dataTransfer.setData('text/plain', '');
                }
            });

            workspace.addEventListener('dragover', (e) => e.preventDefault());

            workspace.addEventListener('drop', (e) => {
                e.preventDefault();
                if (draggedElement) {
                    if (!workspace.contains(draggedElement)) {
                        const clone = draggedElement.cloneNode(true);
                        const originalInput = draggedElement.querySelector('input');
                        if (originalInput) clone.querySelector('input').value = originalInput.value;
                        workspace.appendChild(clone);
                    } else {
                        workspace.appendChild(draggedElement);
                    }
                    draggedElement = null;
                    saveProjectData();
                }
            });

            window.removeBlock = function(el) {
                const block = el.closest('.monkey-block');
                if (block && workspace.contains(block)) {
                    block.remove();
                    saveProjectData();
                }
            };

            // --- INYECCIÓN JS ---
            document.getElementById('btn-inject').addEventListener('click', () => {
                const blockName = prompt(i18n[currentLang].prompt_name, "Efecto Salto");
                if (!blockName) return;

                const jsCode = prompt(
                    i18n[currentLang].prompt_code,
                    "posY -= 30; monkey.style.top = posY + 'px';"
                );
                if (!jsCode) return;

                const newBlock = document.createElement('div');
                newBlock.className = 'monkey-block block-custom';
                newBlock.draggable = true;
                newBlock.innerHTML = `<span>⚙️ ${blockName}</span><span class="btn-delete-block" onclick="removeBlock(this)">✕</span>`;
                newBlock.setAttribute('data-script', jsCode);
                newBlock.setAttribute('data-name', blockName);

                customBlocksArea.appendChild(newBlock);
            });

            // --- GUARDAR Y CARGAR ARCHIVOS .MONKEY ---
            function getProjectPayload() {
                const activeBlocks = workspace.querySelectorAll('.monkey-block');
                const blocksData = [];
                activeBlocks.forEach(block => {
                    const action = block.getAttribute('data-action');
                    const script = block.getAttribute('data-script');
                    const inputElem = block.querySelector('input');
                    const value = inputElem ? inputElem.value : null;
                    blocksData.push({ action, script, value });
                });
                return { id: projectId, blocks: blocksData };
            }

            document.getElementById('btn-save').addEventListener('click', () => {
                const data = JSON.stringify(getProjectPayload(), null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `proyecto_${projectId}.monkey`;
                a.click();
                URL.revokeObjectURL(url);
            });

            document.getElementById('btn-load').addEventListener('click', () => {
                document.getElementById('file-input').click();
            });

            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.blocks) {
                            renderBlocksFromData(parsed.blocks);
                            saveProjectData();
                        }
                    } catch (err) {
                        alert("Error al cargar el archivo .monkey");
                    }
                };
                reader.readAsText(file);
            });

            // --- LOCALSTORAGE & RENDERING ---
            function saveProjectData() {
                const payload = getProjectPayload();
                localStorage.setItem(`monkey_project_${projectId}`, JSON.stringify(payload.blocks));
            }

            function renderBlocksFromData(blocksData) {
                workspace.innerHTML = '';
                blocksData.forEach(item => {
                    let sourceBlock = null;
                    if (item.action) {
                        sourceBlock = document.querySelector(`.toolbox [data-action="${item.action}"]`);
                    }
                    if (sourceBlock) {
                        const clone = sourceBlock.cloneNode(true);
                        if (item.value !== null && clone.querySelector('input')) {
                            clone.querySelector('input').value = item.value;
                        }
                        workspace.appendChild(clone);
                    } else if (item.script) {
                        const newBlock = document.createElement('div');
                        newBlock.className = 'monkey-block block-custom';
                        newBlock.draggable = true;
                        newBlock.innerHTML = `<span>⚙️ Bloque Inyectado</span><span class="btn-delete-block" onclick="removeBlock(this)">✕</span>`;
                        newBlock.setAttribute('data-script', item.script);
                        workspace.appendChild(newBlock);
                    }
                });
            }

            function loadProjectData() {
                const dataRaw = localStorage.getItem(`monkey_project_${projectId}`);
                if (!dataRaw) return;
                try {
                    renderBlocksFromData(JSON.parse(dataRaw));
                } catch(e) {}
            }

            // --- EJECUCIÓN ---
            function executeScript() {
                const activeBlocks = workspace.querySelectorAll('.monkey-block');
                if (activeBlocks.length === 0) return;

                activeBlocks.forEach((block) => {
                    const action = block.getAttribute('data-action');
                    const customScript = block.getAttribute('data-script');

                    if (customScript) {
                        try {
                            const runCustom = new Function('posX', 'posY', 'rotation', 'monkey', customScript);
                            runCustom(posX, posY, rotation, monkey);
                        } catch (err) {
                            console.error(err);
                        }
                    } else {
                        if (action === 'move') {
                            const steps = parseInt(block.querySelector('input').value) || 10;
                            posX += steps;
                            if (posX > 260) posX = 0;
                            monkey.style.left = posX + 'px';
                        } else if (action === 'rotate') {
                            const deg = parseInt(block.querySelector('input').value) || 15;
                            rotation += deg;
                            monkey.style.transform = `rotate(${rotation}deg)`;
                        } else if (action === 'jump') {
                            posX = Math.floor(Math.random() * 240);
                            posY = Math.floor(Math.random() * 180);
                            monkey.style.left = posX + 'px';
                            monkey.style.top = posY + 'px';
                        } else if (action === 'reset') {
                            posX = 130;
                            posY = 100;
                            rotation = 0;
                            monkey.style.left = posX + 'px';
                            monkey.style.top = posY + 'px';
                            monkey.style.transform = `rotate(0deg)`;
                        }
                    }
                });
            }

            document.getElementById('btn-run').addEventListener('click', () => {
                saveProjectData();
                executeScript();
            });

            document.getElementById('btn-clear').addEventListener('click', () => {
                workspace.innerHTML = '';
                saveProjectData();
            });

            window.filterCategory = function(cat, tabElement) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                if (tabElement) tabElement.classList.add('active');

                const groups = document.querySelectorAll('.block-group');
                groups.forEach(group => {
                    if (cat === 'all' || group.getAttribute('data-cat') === cat) {
                        group.style.display = 'block';
                    } else {
                        group.style.display = 'none';
                    }
                });
            };

            loadProjectData();
        });
    </script>
</body>
</html>
