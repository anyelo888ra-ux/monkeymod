<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐵 MonkeyMod v2.0 - Motor Nativo Independiente</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --panel-bg: #181b24;
            --border-color: #232834;
            --accent-orange: #ffab19;
            --motion-blue: #4c97ff;
            --control-orange: #ffab19;
            --custom-purple: #9966ff;
            --danger-red: #dc3545;
            --success-green: #28a745;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* Encabezado Principal */
        header { 
            background-color: var(--panel-bg); 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--accent-orange); 
        }

        .title { 
            font-size: 20px; 
            font-weight: bold; 
            color: var(--accent-orange); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .badge {
            font-size: 11px;
            background: var(--accent-orange);
            color: #111;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .project-id-display {
            font-size: 12px;
            color: #888;
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Botones de acción */
        button { 
            background-color: var(--accent-orange); 
            border: none; 
            color: #111; 
            padding: 8px 14px; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover { 
            filter: brightness(1.15);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-inject { background-color: #00bcd4; color: white; }
        .btn-run { background-color: var(--success-green); color: white; }
        .btn-play { background-color: #4c97ff; color: white; }
        .btn-clear { background-color: var(--danger-red); color: white; }

        /* Contenedor del Editor */
        .editor-container { display: flex; flex: 1; height: calc(100vh - 55px); }

        /* 1. Barra de Categorías + Herramientas (Izquierda) */
        .sidebar {
            width: 280px;
            background-color: #11141a;
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .category-tabs {
            display: flex;
            background: #0b0d10;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            padding: 10px 5px;
            font-size: 11px;
            text-align: center;
            cursor: pointer;
            color: #888;
            font-weight: bold;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: white;
            border-bottom-color: var(--accent-orange);
            background: var(--panel-bg);
        }

        .toolbox { 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            overflow-y: auto; 
            flex: 1;
        }

        .toolbox-title { 
            font-size: 12px; 
            font-weight: bold; 
            color: #888; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 4px; 
        }

        /* Diseños de los Bloques */
        .monkey-block { 
            color: white; 
            padding: 10px 14px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 13px; 
            cursor: grab; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            border-left: 5px solid rgba(0,0,0,0.3); 
            position: relative;
        }

        .monkey-block:active { cursor: grabbing; }

        .block-input { 
            background: rgba(255, 255, 255, 0.25); 
            border: none; 
            color: white; 
            padding: 3px 6px; 
            border-radius: 4px; 
            width: 45px; 
            text-align: center; 
            font-weight: bold; 
            outline: none;
        }

        /* Colores de categorías */
        .block-motion { background-color: var(--motion-blue); }
        .block-control { background-color: var(--control-orange); color: #111; }
        .block-control .block-input { background: rgba(0, 0, 0, 0.15); color: #111; }
        .block-custom { background-color: var(--custom-purple); }

        /* Botón de borrar bloque en el Workspace */
        .btn-delete-block {
            display: none;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
        }

        .workspace .btn-delete-block { display: flex; }

        /* 2. Workspace (Centro) */
        .workspace { 
            flex: 1; 
            background-color: #161920; 
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px); 
            background-size: 20px 20px; 
            padding: 20px; 
            position: relative; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            align-items: flex-start; 
        }

        .workspace:empty::before { 
            content: "Arrastra los bloques aquí para construir tu script..."; 
            color: #4f5a70; 
            font-size: 15px; 
            position: absolute; 
            top: 45%; 
            left: 25%; 
            pointer-events: none; 
        }

        /* 3. Escenario (Derecha) */
        .stage-area { 
            width: 340px; 
            background-color: var(--panel-bg); 
            border-left: 2px solid var(--border-color); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
        }

        .canvas-simulation { 
            width: 300px; 
            height: 240px; 
            background-color: #ffffff; 
            border-radius: 8px; 
            border: 3px solid var(--border-color); 
            position: relative; 
            overflow: hidden; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* Personaje Principal: El Mono */
        #monkey-sprite { 
            font-size: 40px; 
            position: absolute; 
            top: 100px; 
            left: 130px; 
            transition: all 0.2s ease-out; 
            line-height: 1;
            transform-origin: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">
            🐵 MonkeyMod <span class="badge">v2.0 Nativo</span>
            <span id="display-id" class="project-id-display">ID: -------</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-inject" id="btn-inject">➕ Inyectar Bloque (JS)</button>
            <button class="btn-run" id="btn-run">🟢 Ejecutar</button>
            <button class="btn-play" id="btn-play">▶️ Modo Jugador</button>
            <button class="btn-clear" id="btn-clear">🔴 Limpiar</button>
        </div>
    </header>

    <div class="editor-container">
        <!-- 1. BARRA DE HERRAMIENTAS -->
        <div class="sidebar">
            <div class="category-tabs">
                <div class="tab active" onclick="filterCategory('all')">Todos</div>
                <div class="tab" onclick="filterCategory('motion')">Movimiento</div>
                <div class="tab" onclick="filterCategory('control')">Control</div>
                <div class="tab" onclick="filterCategory('custom')">Inyectados</div>
            </div>

            <div class="toolbox" id="monkey-toolbox">
                <!-- Bloques de Movimiento -->
                <div class="block-group" data-cat="motion">
                    <div class="toolbox-title">Movimiento</div>
                    <div class="monkey-block block-motion" draggable="true" data-action="move">
                        <span>Mover <input type="number" class="block-input" value="10" onclick="event.stopPropagation()"> pasos</span>
                        <span class="btn-delete-block" onclick="removeBlock(this)">✕</span>
                    </div>
                    <div class="monkey-block block-motion" draggable="true" data-action="rotate">
                        <span>Girar 🔄 <input type="number" class="block-input" value="15" onclick="event.stopPropagation()"> grados</span>
                        <span class="btn-delete-block" onclick="removeBlock(this)">✕</span>
                    </div>
                    <div class="monkey-block block-motion" draggable="true" data-action="jump">
                        <span>Ir a posición aleatoria</span>
                        <span class="btn-delete-block" onclick="removeBlock(this)">✕</span>
                    </div>
                </div>

                <!-- Bloques de Control -->
                <div class="block-group" data-cat="control">
                    <div class="toolbox-title">Control</div>
                    <div class="monkey-block block-control" draggable="true" data-action="reset">
                        <span>Reiniciar posición</span>
                        <span class="btn-delete-block" onclick="removeBlock(this)">✕</span>
                    </div>
                </div>

                <!-- Bloques Inyectados -->
                <div class="block-group" data-cat="custom">
                    <div class="toolbox-title">Bloques Inyectados</div>
                    <div id="custom-blocks-area" style="display:flex; flex-direction:column; gap:10px;"></div>
                </div>
            </div>
        </div>

        <!-- 2. ESPACIO DE TRABAJO -->
        <div class="workspace" id="monkey-workspace"></div>

        <!-- 3. ESCENARIO -->
        <div class="stage-area">
            <div class="toolbox-title" style="width: 100%;">Escenario</div>
            <div class="canvas-simulation">
                <div id="monkey-sprite">🐵</div>
            </div>
            <div style="color: #626e82; font-size: 12px; text-align: center;">
                Arrastra los bloques verticalmente al espacio de trabajo central y presiona "Ejecutar".
            </div>
        </div>
    </div>

    <script>
        // Función para generar un ID aleatorio único
        function generateUniqueId() {
            return 'proj_' + Math.random().toString(36).substring(2, 10);
        }

        // Gestión de la URL e ID del Proyecto
        const urlParams = new URLSearchParams(window.location.search);
        let projectId = urlParams.get('id');

        if (!projectId) {
            projectId = generateUniqueId();
            const newUrl = `${window.location.pathname}?id=${projectId}`;
            window.history.replaceState({ path: newUrl }, '', newUrl);
        }

        document.getElementById('display-id').innerText = `ID: ${projectId}`;

        // Redirección al modo jugador preservando la ID
        document.getElementById('btn-play').addEventListener('click', () => {
            window.location.href = `play.html?id=${projectId}`;
        });

        // --- SISTEMA DRAG AND DROP NATIVO ---
        const monkey = document.getElementById('monkey-sprite');
        const toolbox = document.getElementById('monkey-toolbox');
        const workspace = document.getElementById('monkey-workspace');
        const customBlocksArea = document.getElementById('custom-blocks-area');
        
        let posX = 130;
        let posY = 100;
        let rotation = 0;
        let draggedElement = null;

        document.addEventListener('dragstart', (e) => {
            const block = e.target.closest('.monkey-block');
            if (block) {
                draggedElement = block;
                e.dataTransfer.setData('text/plain', '');
            }
        });

        workspace.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        workspace.addEventListener('drop', (e) => {
            e.preventDefault();
            if (draggedElement) {
                if (!workspace.contains(draggedElement)) {
                    const clone = draggedElement.cloneNode(true);
                    const originalInput = draggedElement.querySelector('input');
                    if (originalInput) {
                        clone.querySelector('input').value = originalInput.value;
                    }
                    workspace.appendChild(clone);
                } else {
                    workspace.appendChild(draggedElement);
                }
                draggedElement = null;
            }
        });

        function removeBlock(el) {
            const block = el.closest('.monkey-block');
            if (block && workspace.contains(block)) {
                block.remove();
            }
        }

        // --- INYECCIÓN DINÁMICA DE BLOQUES (JS/HTML) ---
        document.getElementById('btn-inject').addEventListener('click', () => {
            const blockName = prompt("Nombre de tu nuevo bloque:", "Efecto Salto");
            if (!blockName) return;

            const jsCode = prompt(
                "Escribe el código JavaScript a ejecutar:\nVariables disponibles: posX, posY, rotation, monkey\nEjemplo:",
                "posY -= 30; monkey.style.top = posY + 'px';"
            );
            if (!jsCode) return;

            const newBlock = document.createElement('div');
            newBlock.className = 'monkey-block block-custom';
            newBlock.draggable = true;
            newBlock.innerHTML = `<span>⚙️ ${blockName}</span><span class="btn-delete-block" onclick="removeBlock(this)">✕</span>`;
            newBlock.setAttribute('data-script', jsCode);

            customBlocksArea.appendChild(newBlock);
            alert(`¡Bloque "${blockName}" inyectado correctamente!`);
        });

        // --- MOTOR DE EJECUCIÓN SCRIPT ---
        document.getElementById('btn-run').addEventListener('click', () => {
            const activeBlocks = workspace.querySelectorAll('.monkey-block');
            if (activeBlocks.length === 0) {
                alert("¡Arrastra al menos un bloque al centro primero!");
                return;
            }

            activeBlocks.forEach((block) => {
                const action = block.getAttribute('data-action');
                const customScript = block.getAttribute('data-script');

                if (customScript) {
                    try {
                        const runCustom = new Function('posX', 'posY', 'rotation', 'monkey', customScript);
                        runCustom(posX, posY, rotation, monkey);
                    } catch (err) {
                        console.error("Error en bloque personalizado:", err);
                    }
                } else {
                    if (action === 'move') {
                        const steps = parseInt(block.querySelector('input').value) || 10;
                        posX += steps;
                        if (posX > 260) posX = 0;
                        monkey.style.left = posX + 'px';
                    } else if (action === 'rotate') {
                        const deg = parseInt(block.querySelector('input').value) || 15;
                        rotation += deg;
                        monkey.style.transform = `rotate(${rotation}deg)`;
                    } else if (action === 'jump') {
                        posX = Math.floor(Math.random() * 240);
                        posY = Math.floor(Math.random() * 180);
                        monkey.style.left = posX + 'px';
                        monkey.style.top = posY + 'px';
                    } else if (action === 'reset') {
                        posX = 130;
                        posY = 100;
                        rotation = 0;
                        monkey.style.left = posX + 'px';
                        monkey.style.top = posY + 'px';
                        monkey.style.transform = `rotate(0deg)`;
                    }
                }
            });
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            workspace.innerHTML = '';
        });

        function filterCategory(cat) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            const groups = document.querySelectorAll('.block-group');
            groups.forEach(group => {
                if (cat === 'all' || group.getAttribute('data-cat') === cat) {
                    group.style.display = 'block';
                } else {
                    group.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
