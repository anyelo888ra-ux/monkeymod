<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyMod - Iniciar Sesión</title>
    <style>
        body { background-color: #1e1e24; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #2a2a32; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 350px; border-top: 4px solid #4cc9f0; }
        .logo { font-size: 26px; font-weight: bold; color: #ff9f1c; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #aaa; font-size: 14px; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #ddd; }
        input { padding: 12px; border-radius: 6px; border: 1px solid #444; background: #1e1e24; color: white; font-size: 14px; }
        input:focus { border-color: #4cc9f0; outline: none; }
        .btn-login { background: #4cc9f0; color: #1e1e24; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; width: 100%; transition: background 0.2s; }
        .btn-login:hover { background: #3ab0d6; }
        .footer-text { text-align: center; margin-top: 20px; font-size: 13px; color: #aaa; }
        .footer-text a { color: #ff9f1c; text-decoration: none; font-weight: bold; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
    <!-- Importación nativa de la librería cliente de Supabase -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="login-card">
    <div class="logo">🐒 MonkeyMod</div>
    <div class="subtitle">Ingresa a tu cuenta de desarrollador</div>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" placeholder="tu@correo.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn-login">Entrar</button>
    </form>

    <div class="footer-text">
        ¿No tienes una cuenta aún? <a href="/register.html">Regístrate aquí</a>
    </div>
</div>

<script>
    // 🛠️ CONFIGURACIÓN DE TU CLIENTE SUPABASE (Usa las mismas llaves que en register.html)
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_ANON_KEY = "TU-SUPABASE-ANON-KEY";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleLogin(event) {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // 🚀 Supabase toma la contraseña, le aplica el hash y verifica de forma automática en milisegundos
        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            console.error("Fallo al autenticar:", error.message);
            alert("Error al iniciar sesión: " + error.message);
        } else {
            console.log("¡Sesión encriptada verificada correctamente!", data.session);
            alert("¡Bienvenido de vuelta a MonkeyMod!");
            window.location.href = "/edit.html"; // Redirección directa a tu editor nativo
        }
    }
</script>

</body>
</html>
