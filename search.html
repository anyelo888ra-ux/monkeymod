<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐵 MonkeyMod - Buscar Proyectos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #111111;
            color: white;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #00bcd4;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }
        .btn-back {
            background-color: #ffab19;
            color: black;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h2 {
            color: #ffab19;
            border-bottom: 2px solid #ffab19;
            padding-bottom: 10px;
        }
        .result-box {
            background-color: #222222;
            padding: 30px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            color: #aaaaaa;
            border: 1px solid #333333;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">🐵 MonkeyMod</a>
        <a href="index.html" class="btn-back">⬅ Volver al inicio</a>
    </nav>

    <div class="container">
        <h2>Resultados de búsqueda para: <span id="search-query" style="color: white;"></span></h2>
        
        <div class="result-box">
            <p id="search-status">Aún no hay proyectos compartidos públicamente con este nombre.</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        
        if (query && query.trim() !== '') {
            document.getElementById('search-query').innerText = query;
        } else {
            document.getElementById('search-query').innerText = "Ninguna búsqueda";
            document.getElementById('search-status').innerText = "Escribe un término de búsqueda en la barra superior para encontrar proyectos.";
        }
    </script>
</body>
</html>
